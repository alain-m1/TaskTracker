spring.application.name=task-tracker-api
server.port=8080

# --- MySQL ---
# Create the database first: CREATE DATABASE task_tracker;
spring.datasource.url=jdbc:mysql://localhost:3306/task_tracker?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Creates/updates the table from the Task entity automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Run data.sql (seed rows) after Hibernate creates the schema, every startup.
# data.sql uses INSERT IGNORE with fixed ids so re-running it is safe.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
